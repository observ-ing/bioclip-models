name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # species-range-index is a git dependency built from Rust source via
      # maturin at install time, so the build needs a Rust toolchain on PATH.
      - uses: dtolnay/rust-toolchain@stable

      # Read the version from .python-version so CI and local setup can't drift.
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: pip install -e '.[dev]'

      - name: Ruff lint
        run: ruff check bioclip_models/

      - name: Pyright strict
        run: pyright bioclip_models/

      - name: Pytest
        run: pytest tests/
