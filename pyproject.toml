[project]
name = "bioclip-models"
version = "0.3.0"
description = "BioCLIP model preparation pipeline for Observ.ing species identification"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
]

[project.optional-dependencies]
export = [
    "torch>=2.1",
    "open_clip_torch>=2.24",
    "onnx>=1.15",
]
verify = [
    "onnxruntime>=1.17",
    "pillow>=10.0",
    # Read OGI1 geo-index files through the production Rust reader instead of a
    # hand-rolled parser. Built from source via maturin (needs a Rust toolchain
    # at install time).
    "species-range-index @ git+https://github.com/observ-ing/species-range-index@v0.5.0#subdirectory=python",
]
eval = [
    "onnxruntime>=1.17",
    "pillow>=10.0",
]
geo = [
    "geopandas>=1.0",
    "h3>=4.1",
    "shapely>=2.0",
    # Read back / round-trip OGI1 indices through the production Rust reader.
    "species-range-index @ git+https://github.com/observ-ing/species-range-index@v0.5.0#subdirectory=python",
]
dev = [
    "bioclip-models[export,verify,eval,geo]",
    "pytest>=8.0",
    "ruff>=0.4",
    "pyright>=1.1.400",
]

[project.scripts]
bioclip-prepare = "bioclip_models.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bioclip_models*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Selected explicitly rather than inherited. Ruff 0.16.0 widened its default
# rule set from 118 rules to 826, which turned CI red on unchanged code — the
# `ruff>=0.4` dependency has no upper bound, so the runner picked it up
# silently. This is ruff's historical default (E4/E7/E9/F) plus pyupgrade.
select = ["E4", "E7", "E9", "F", "UP"]

[tool.pyright]
include = ["bioclip_models"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
# Third-party ML libs (torch, open_clip, onnxruntime) either have no stubs or
# very partial ones. Strict mode would flag every call as Unknown*; allow it.
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportMissingParameterType = false
reportUntypedFunctionDecorator = false
